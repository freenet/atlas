# Pinned so the index-contract WASM is byte-reproducible across machines and CI.
# The contract's address is the hash of its compiled WASM, so a toolchain drift
# silently re-keys the live index (orphaning its curated entries). Pin the exact
# toolchain, and ALWAYS rebuild the WASM via `contracts/index-contract/build-wasm.sh`,
# which sets `--remap-path-prefix` RUSTFLAGS so registry/sysroot/checkout paths
# don't leak into the binary and break cross-machine reproducibility. (A plain
# `cargo build` skips that remapping and produces a path-leaking, re-keyed WASM.)
[toolchain]
channel = "1.96.0"
components = ["rustfmt", "clippy"]
targets = ["wasm32-unknown-unknown"]
