[package]
name = "atlasctl"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Atlas curator CLI: manage the index contract on a Freenet node"

[[bin]]
name = "atlasctl"
path = "src/main.rs"

[dependencies]
serde_json = "1"
atlas-common = { workspace = true, features = ["rng"] }
ciborium.workspace = true
ed25519-dalek = { workspace = true, features = ["rand_core"] }
freenet-stdlib = { workspace = true, features = ["net"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
tokio-tungstenite = { version = "0.27", features = ["rustls-tls-webpki-roots"] }
anyhow = "1"
serde.workspace = true
clap = { version = "4", features = ["derive"] }
bs58.workspace = true
rand.workspace = true
# Shared contract upgrade-migration machinery (registry shape, key derivation,
# backward-probe decision driver). Contract half only: Atlas has no delegate.
freenet-migrate = "0.6"

[build-dependencies]
# Build-time registry parsing + hash validation + lineage codegen for
# `legacy_contracts.toml` (see build.rs).
freenet-migrate-build = "0.2.0"
