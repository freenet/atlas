[package]
name = "atlas-crawler"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Atlas crawler: discovers links, describes them (LLM), and adds them to the index"

[[bin]]
name = "atlas-crawler"
path = "src/main.rs"

[dependencies]
# Read-only access to the river-mirror SQLite replica (see `mirror.rs`).
rusqlite = { version = "0.32", features = ["bundled"] }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { workspace = true }
serde_json = "1"
url = "2"

[dev-dependencies]
tempfile = "3"
# Test-only: the differential assertion that the CONTRACT-enforced path guards in
# `atlas_common::path` are never weaker than the crawler's older private copies.
# Deliberately not a normal dependency — it is used by one `#[cfg(test)]` block, and
# as a production dep it linked ed25519-dalek, ciborium, bs58 and rand into the
# shipped binary for nothing.
atlas-common = { workspace = true }
