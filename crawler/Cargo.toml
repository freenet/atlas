[package]
name = "atlas-crawler"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Atlas crawler: discovers links, describes them (LLM), and adds them to the index"

[[bin]]
name = "atlas-crawler"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { workspace = true }
serde_json = "1"
url = "2"

# River-room ingestion (Atlas issue #2). river-core re-exports `ChatRoomStateV1`
# and (behind the `migration` feature) the owner-VK-anchored room-contract key
# derivation used to survive River re-keys. river-core 0.1.13 pulls
# freenet-stdlib ^0.8.3, which is ALSO the version the local node speaks
# (freenet-core 0.2.97 embeds stdlib 0.8.2), so the crawler's WS client and the
# room-state types share one stdlib version. This is DELIBERATELY separate from
# the atlas workspace's freenet-stdlib 0.6.0 pin: bumping the workspace would
# rebuild the Atlas index contract WASM and re-key the live Atlas index, so the
# cli/ui/contract crates stay on 0.6.0 while only the crawler talks 0.8 (it
# never shares a stdlib type with them — it shells out to `atlasctl` to add).
river-core = { version = "0.1.13", features = ["migration"] }
freenet-stdlib = { version = "0.8.3", features = ["net"] }
ciborium = "0.2.2"
ed25519-dalek = "2.1.1"
bs58 = "0.5"
tokio = { version = "1", features = ["rt-multi-thread", "time", "net", "io-util"] }
tokio-tungstenite = { version = "0.27", features = ["rustls-tls-webpki-roots"] }
