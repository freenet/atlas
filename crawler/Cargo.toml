[package]
name = "atlas-crawler"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Atlas crawler: discovers links, describes them (LLM), and adds them to the index"

[[bin]]
name = "atlas-crawler"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { workspace = true }
serde_json = "1"
url = "2"

# River-room ingestion (Atlas issue #2). river-core re-exports `ChatRoomStateV1`
# and (behind the `migration` feature) the owner-VK-anchored room-contract key
# derivation used to survive River re-keys. river-core 0.1.13 requires
# freenet-stdlib ^0.8.3, which matches the workspace pin (and the version the
# local node speaks), so the crawler's WS client and the room-state types share
# one stdlib.
river-core = { version = "0.1.13", features = ["migration"] }
freenet-stdlib = { workspace = true, features = ["net"] }
ciborium = { workspace = true }
# The workspace pins this with default-features off so the contract WASM stays
# lean; the crawler is a native binary and needs `std` for error interop.
ed25519-dalek = { workspace = true, features = ["std"] }
bs58 = { workspace = true }
tokio = { version = "1", features = ["rt-multi-thread", "time", "net", "io-util"] }
tokio-tungstenite = { version = "0.27", features = ["rustls-tls-webpki-roots"] }
