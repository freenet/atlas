[workspace]
resolver = "2"
members = ["common", "contracts/index-contract", "cli", "ui", "crawler"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "LGPL-3.0-only"
repository = "https://github.com/freenet/atlas"

[workspace.dependencies]
atlas-common = { package = "fn-atlas-common", path = "common", version = "0.1.0" }
ciborium = "0.2.2"
serde = { version = "1.0", features = ["derive"] }
# Verify-only in the contract (no rng features) so the WASM stays getrandom-free.
# Key generation / random ids live behind atlas-common's `rng` feature, enabled
# only by native crates (cli, crawler).
ed25519-dalek = { version = "2.1.1", default-features = false, features = ["alloc", "serde"] }
blake3 = { version = "1.5.3", features = ["serde"] }
bs58 = "0.5"
freenet-stdlib = "0.8.3"
rand = "0.8"
