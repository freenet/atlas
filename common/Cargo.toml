[package]
# Published name. `atlas-common` was taken on crates.io in Aug 2025 by an
# unrelated IntelLabs ML-provenance crate, and crates.io requires every path
# dependency of a published crate to itself be published under a real name.
#
# Consumers still write `use atlas_common::…`: the workspace renames this
# dependency back (`atlas-common = { package = "fn-atlas-common", … }`), which
# is why this is a two-line change rather than a rename across every file.
name = "fn-atlas-common"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Shared types for the Atlas discovery layer on Freenet"

[dependencies]
ciborium.workspace = true
serde.workspace = true
ed25519-dalek.workspace = true
blake3.workspace = true
bs58.workspace = true
# Only pulled in when the `rng` feature is enabled (native crates). Keeping it
# optional keeps the contract build free of getrandom/wasm-bindgen placeholders.
rand = { workspace = true, optional = true }

[features]
default = []
# Key generation and random subject-id minting. Native-only (cli, crawler).
rng = ["dep:rand", "ed25519-dalek/rand_core"]

[dev-dependencies]
rand.workspace = true
ed25519-dalek = { workspace = true, features = ["rand_core"] }
